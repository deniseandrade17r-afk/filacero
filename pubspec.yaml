name: filacero
description: "FilaCero - Gestión de trámites y fila virtual, Universidad de Sonora."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  google_fonts: ^9.0.0
  file_picker: ^13.4.1
  url_launcher: ^6.3.3
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/buho.png