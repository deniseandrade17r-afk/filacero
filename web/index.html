<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Flutter reemplaza $FLUTTER_BASE_HREF con el valor de --base-href al compilar -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Avanza tu trámite, no tu espera.">
  <meta name="theme-color" content="#1B2A6B">

  <!-- iOS y app instalable -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FilaCero">
  <link rel="apple-touch-icon" href="icons/logo-filacero.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo-filacero.png">

  <title>FilaCero</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.__pwaEvento = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaEvento = e;
    });
    window.addEventListener('appinstalled', function () { window.__pwaEvento = null; });
    window.pwaDisponible = function () { return !!window.__pwaEvento; };
    window.pwaInstalada = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    };
    window.pwaPlataforma = function () {
      var ua = navigator.userAgent || '';
      var ios = /iphone|ipad|ipod/i.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return ios ? 'ios' : 'otro';
    };
    window.pwaInstalar = function () {
      if (!window.__pwaEvento) return Promise.resolve('no');
      var ev = window.__pwaEvento;
      ev.prompt();
      return ev.userChoice.then(function (r) { window.__pwaEvento = null; return r.outcome; });
    };
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
